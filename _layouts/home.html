<html>

{% include head.html %}

<body>

    {% include header.html %}

    <!-- Banner -->
    <section id="banner" class="major">
        <div class="inner">
            <header class="major">
                <h1 style="text-transform: uppercase;">{{ page.landing-title }}</h1>
            </header>
            <div class="content">
                <p style="text-transform: none;font-size: 14px;font-weight: normal;">{{ site.description }}</p>
                <ul class="actions">
                    <p><br><br><br></p>
					<li><a href="#one" class="button next scrolly">Explore My Projects</a></li>
					<p></p>
					<li><a href="#two" class="button next scrolly">Contact Me</a></li>
				</ul>
            </div>
        </div>
		<!--Profile pic-->
		<div class="profile-pic">
			<img src="{{ '/assets/images/prof_pic.png' | relative_url }}" alt="Profile Picture">
		</div>
	</section>
	

    <!-- Main -->
    <div id="main">

        <!-- One -->
        {% include tiles.html %}

        <!-- Two -->
        <section id="two">
            <div class="inner">
                <header class="major">
                    <h2>Contact me</h2>
                </header>
                <p>{{ content }}</p>
            </div>
        </section>

    </div>

    {% include footer.html %}

</body>

</html>
