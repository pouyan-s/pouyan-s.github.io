<html>

    {% include head.html %}

    <body>

        {% include header.html %}

        <section id="banner" class="style5">
            <div class="inner">
                <span class="image">
                    <img src="{{ site.baseurl }}/{{ page.image }}" alt="">
                </span>
                <header class="major">

                    <h1>{{ page.title }}</h1>

                </header>
                <div class="content">

                    <p style="font-weight: bold; font-size:14px; background-color: rgba(36, 41, 67, 0.3);">{{ page.description }}</p>

                </div>
            </div>
        </section>

    {{ content }}

    {% include footer.html %}

</body>

</html>
